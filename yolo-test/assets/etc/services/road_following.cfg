# sample cfg

road_following:
{
    # Kept for the takeoff state, which still reads this service config.
    droneAltitude = 10.0; /* [m] */

    # YOLO model used by the cv_road processing stage.
    # Use a small ONNX model supported by OpenCV DNN, for example YOLOv5n
    # or YOLOv8n exported to ONNX.
    yoloModelPath = "models/yolo.onnx"; /* [string] */
    yoloInputWidth = 640; /* [pixel] */
    yoloInputHeight = 640; /* [pixel] */
    yoloConfidenceThreshold = 0.25; /* [No unit] */
    yoloNmsThreshold = 0.45; /* [No unit] */
}
