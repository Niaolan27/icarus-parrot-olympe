syntax = "proto3";

package parrot.missions.samples.yolo.airsdk.messages;

import 'parrot/protobuf/extensions.proto';

option java_package = "com.parrot.drone.missions.samples.yolo.airsdk";
option java_outer_classname = "Yolo";

option (olympe_package) = "parrot.missions.samples.yolo";

message Command {
    oneof id {
        bool enable_cv = 1;
    }
}

message YoloDetection {
    int32 class_id = 1;
    float confidence = 2;
    int32 x = 3;
    int32 y = 4;
    int32 width = 5;
    int32 height = 6;
}

message YoloDetections {
    repeated YoloDetection detections = 1;
}

message PositionEstimationResult {
    int64 timestamp_ms = 1;
    int32 class_id = 2;
    float confidence = 3;
    float x_center = 4;
    float y_center = 5;
    double forward_m = 6;
    double side_m = 7;
    double north_m = 8;
    double east_m = 9;
    double latitude = 10;
    double longitude = 11;
}

message PositionEstimationResults {
    repeated PositionEstimationResult results = 1;
}

message Event {
    reserved 1;
    reserved "yolo_inference_done";

    oneof id {
        YoloDetection yolo_detection = 2;
        YoloDetections yolo_detections = 3;
        PositionEstimationResults position_estimation_results = 4;
    }
}
