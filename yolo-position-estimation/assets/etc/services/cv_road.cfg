# CV service configuration

road_following:
{
    # Legacy road-following fields are kept because the CV service still
    # reads this configuration structure internally. Keep them motion-neutral.
    droneAltitude = 0.0; /* [m] */
    xVelocity = 0.0; /* [m/s] */
    xVelocityRoadLost = 0.0; /* [m/s] */
    yVelocityCoefficient = 0.0; /* [No unit] */
    yawVelocityCoefficient = 1.0; /* [No unit] */
    lostRoadTimeLimit = 5; /* [second] */

    telemetryProducerSection = "cv_road"; /* [string] */
    telemetryProducerSectionRate = 50; /* [ms] */
    telemetryProducerSectionCount = 10; /* [No unit] */

    yoloParamPath = "models/model.ncnn.param";
    yoloBinPath = "models/model.ncnn.bin";
    yoloInputBlob = "";
    yoloOutputBlob = "";
    yoloInputWidth = 320;
    yoloInputHeight = 192;
    yoloConfidenceThreshold = 0.50;
    yoloNmsThreshold = 0.45;
    STREAM_YOLO_DETECTIONS = true;
    positionEstimationTriggerPeriodSeconds = 0.50; /* [second] */
}
